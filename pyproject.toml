[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-transition-monitor"
version = "0.1.0"
description = "Read-only Trading 212 portfolio transition monitor"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
  "exchange-calendars>=4.13.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "hypothesis>=6.110,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "types-PyYAML",
]

[project.scripts]
portfolio-monitor = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true